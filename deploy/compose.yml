name: distributed-cache
x-shard: &shard
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment:
    DATABASE_URL: postgres://cache:cache@postgres:5432/cache?sslmode=disable
    WRITE_POLICY: ${WRITE_POLICY:-write-through}
  command: ["-config", "/app/nodes.json", "-enable_https=false", "-enable_client_auth=false"]
  depends_on:
    postgres:
      condition: service_healthy
  stop_grace_period: 30s
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cache
      POSTGRES_PASSWORD: cache
      POSTGRES_DB: cache
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cache"]
      interval: 2s
      timeout: 2s
      retries: 20
  shard1:
    <<: *shard
    hostname: shard1
  shard2:
    <<: *shard
    hostname: shard2
  shard3:
    <<: *shard
    hostname: shard3
  coordinator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/app/gateway"]
    environment:
      SHARDS: http://shard1:8080,http://shard2:8080,http://shard3:8080
    ports: ["8080:8080"]
    depends_on: [shard1, shard2, shard3]
  client:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/app/gateway"]
    environment:
      SHARDS: http://coordinator:8080
    ports: ["8081:8080"]
    depends_on: [coordinator]
volumes:
  postgres-data:
